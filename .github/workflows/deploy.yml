name: Global Build & Deploy (Standalone)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Build Standalone
        # This is where the 400% CPU happens (on GitHub, not your VPS!)
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'dummy-secret-for-build' }}
          DATABASE_URL: mongodb://127.0.0.1:27017/build-db
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL || 'http://localhost:3000' }}
        run: |
          pnpm install
          pnpm build
          
          # Prepare the deployment folder
          # Next.js standalone doesn't automatically copy public and static files
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
          cp ecosystem.config.cjs .next/standalone/

      - name: Cleanup VPS Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Create dir if not exists
            mkdir -p /root/herbgarden
            # Clean everything but preserve .env and logs
            # We use a more robust way to delete
            cd /root/herbgarden
            ls -A | grep -vE '^(.env|logs)$' | xargs rm -rf 2>/dev/null || true

      - name: Clean & Sync to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          # CRITICAL: We need the .next folder (which is hidden) 
          # so we use a more inclusive glob or multiple sources
          source: ".next/standalone/*, .next/standalone/.next/*"
          target: "/root/herbgarden"
          strip_components: 2

      - name: Finalize & Reload PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/herbgarden
            
            # Use startOrReload to ensure PM2 picks up any changes in ecosystem.config.cjs
            pm2 startOrReload ecosystem.config.cjs
            pm2 save