name: Global Build & Deploy (Standalone)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Build Standalone
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: mongodb://127.0.0.1:27017/build-db
          # FIX 1: Use real secret, not dummy — NEXT_PUBLIC_* is baked into
          # the bundle at build time and cannot be overridden at runtime
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
        run: |
          pnpm install
          pnpm build

          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp ecosystem.config.cjs .next/standalone/

          # FIX 2: Create the logs dir so PM2 doesn't fail on first start
          mkdir -p .next/standalone/logs

          cd .next/standalone
          tar -czf /tmp/herbgarden-deploy.tar.gz .

      - name: Upload archive to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "/tmp/herbgarden-deploy.tar.gz"
          target: "/tmp"
          # FIX 3: strip_components: 2 was stripping the filename itself,
          # causing the file to not land at /tmp on the VPS. Removed entirely.

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/herbgarden

            # Preserve .env and logs, wipe everything else
            ls -A | grep -vE '^(.env|logs)$' | xargs rm -rf || true

            tar -xzf /tmp/herbgarden-deploy.tar.gz -C /root/herbgarden
            rm /tmp/herbgarden-deploy.tar.gz

            # Verify critical files exist before restarting
            echo "--- Deployment contents ---"
            ls -la /root/herbgarden
            echo "--- .next/static check ---"
            ls -la /root/herbgarden/.next/static
            echo "--- server.js check ---"
            ls -la /root/herbgarden/server.js

            pm2 startOrReload /root/herbgarden/ecosystem.config.cjs
            pm2 save