name: Global Build & Deploy (Standalone)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Build Standalone
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: mongodb://127.0.0.1:27017/build-db
          PAYLOAD_PUBLIC_SERVER_URL: ${{ secrets.PAYLOAD_PUBLIC_SERVER_URL }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          RESEND_API_KEY: ""
          RESEND_DEFAULT_FROM_ADDRESS: ${{ secrets.RESEND_DEFAULT_FROM_ADDRESS }}
          RESEND_DEFAULT_ADMIN_EMAIL: ${{ secrets.RESEND_DEFAULT_ADMIN_EMAIL }}
          RESEND_DEFAULT_FROM_NAME: ${{ secrets.RESEND_DEFAULT_FROM_NAME }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          NEXT_PUBLIC_POSTHOG_KEY: ""
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ""
        run: |
          pnpm install
          pnpm build

          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp ecosystem.config.cjs .next/standalone/
          mkdir -p .next/standalone/logs

          mv .next/standalone /tmp/herbgarden

      - name: Upload to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "/tmp/herbgarden"
          target: "/tmp"
          strip_components: 2

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "--- Verifying upload ---"
            ls -la /tmp/

            echo "--- Swapping deployment ---"
            cd /root/herbgarden
            ls -A | grep -vE '^(.env|logs)$' | xargs rm -rf || true

            cp /tmp/server.js .
            cp /tmp/package.json .
            cp /tmp/ecosystem.config.cjs .
            cp -r /tmp/public .
            cp -r /tmp/.next .
            cp -r /tmp/node_modules . 2>/dev/null || true
            cp -r /tmp/src . 2>/dev/null || true

            rm -rf /tmp/herbgarden 2>/dev/null || true

            echo "--- Verifying deployment ---"
            ls -la /root/herbgarden
            ls -la /root/herbgarden/server.js
            ls -la /root/herbgarden/.next/static/

            pm2 startOrReload /root/herbgarden/ecosystem.config.cjs
            pm2 save