name: Global Build & Deploy (Standalone)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Build Standalone
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: mongodb://127.0.0.1:27017/build-db
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
        run: |
          pnpm install
          pnpm build

          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp ecosystem.config.cjs .next/standalone/
          mkdir -p .next/standalone/logs

          # FIX: No manual tar — move the standalone folder to a known path
          # and let appleboy/scp-action handle the transfer itself
          mv .next/standalone /tmp/herbgarden

      - name: Upload to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          # FIX: Upload the folder directly, not a pre-made tar.
          # scp-action will tar it, scp it, and extract it at the target.
          # It will land as /tmp/herbgarden/ on the VPS.
          source: "/tmp/herbgarden"
          target: "/tmp"
          strip_components: 2

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "--- Verifying upload landed correctly ---"
            ls -la /tmp/herbgarden/

            echo "--- Swapping deployment ---"
            cd /root/herbgarden

            # Preserve .env and logs, wipe everything else
            ls -A | grep -vE '^(.env|logs)$' | xargs rm -rf || true

            # FIX: Move files from where scp-action actually put them
            mv /tmp/herbgarden/* /root/herbgarden/
            mv /tmp/herbgarden/.[!.]* /root/herbgarden/ 2>/dev/null || true
            rm -rf /tmp/herbgarden

            echo "--- Deployment contents ---"
            ls -la /root/herbgarden
            echo "--- server.js check ---"
            ls -la /root/herbgarden/server.js
            echo "--- .next/static check ---"
            ls -la /root/herbgarden/.next/static/

            pm2 startOrReload /root/herbgarden/ecosystem.config.cjs
            pm2 save