name: Build & Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DEPLOY_PATH: /root/herbgarden
  PM2_APP_NAME: herbgarden

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: mongodb://dummy:dummy@localhost:27017/dummy
          PAYLOAD_SECRET: dummy-secret-for-build
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          PAYLOAD_PUBLIC_SERVER_URL: ${{ secrets.PAYLOAD_PUBLIC_SERVER_URL }}
          PREVIEW_SECRET: dummy-preview-secret
          COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          RESEND_API_KEY: ""
          RESEND_DEFAULT_FROM_ADDRESS: ${{ secrets.RESEND_DEFAULT_FROM_ADDRESS }}
          RESEND_DEFAULT_ADMIN_EMAIL: ${{ secrets.RESEND_DEFAULT_ADMIN_EMAIL }}
          RESEND_DEFAULT_FROM_NAME: ${{ secrets.RESEND_DEFAULT_FROM_NAME }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          NEXT_PUBLIC_POSTHOG_KEY: ""
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ""

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          cp ecosystem.config.cjs deploy/ecosystem.config.cjs
          mkdir -p deploy/logs

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: 'deploy/*'
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ${{ env.DEPLOY_PATH }}

            # Write .env file (never overwritten by deploy, only on explicit redeploy)
            cat > .env << 'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}
            PAYLOAD_PUBLIC_SERVER_URL=${{ secrets.PAYLOAD_PUBLIC_SERVER_URL }}
            PREVIEW_SECRET=${{ secrets.PREVIEW_SECRET }}
            COMPANY_NAME=${{ secrets.COMPANY_NAME }}
            SITE_NAME=${{ secrets.SITE_NAME }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_DEFAULT_FROM_ADDRESS=${{ secrets.RESEND_DEFAULT_FROM_ADDRESS }}
            RESEND_DEFAULT_ADMIN_EMAIL=${{ secrets.RESEND_DEFAULT_ADMIN_EMAIL }}
            RESEND_DEFAULT_FROM_NAME=${{ secrets.RESEND_DEFAULT_FROM_NAME }}
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
            S3_REGION=${{ secrets.S3_REGION }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
            NODE_ENV=production
            ENVEOF

            # Verify key files exist
            echo "--- Verifying deployment ---"
            ls -la ${{ env.DEPLOY_PATH }}/server.js
            ls -la ${{ env.DEPLOY_PATH }}/.next/static/

            # Restart or start PM2 app
            pm2 describe ${{ env.PM2_APP_NAME }} > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              pm2 restart ${{ env.PM2_APP_NAME }}
            else
              pm2 start ecosystem.config.cjs --only ${{ env.PM2_APP_NAME }}
            fi

            pm2 save