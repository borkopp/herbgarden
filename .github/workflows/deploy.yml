name: Global Build & Deploy (Standalone)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Build Standalone
        # This is where the 400% CPU happens (on GitHub, not your VPS!)
        run: |
          pnpm install
          pnpm build
          
          # Prepare the deployment folder
          # Next.js standalone doesn't automatically copy public and static files
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
          cp ecosystem.config.cjs .next/standalone/

      - name: Clean & Sync to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: ".next/standalone/*"
          target: "/root/herbgarden"
          strip_components: 2 # This removes the '.next/standalone' folder prefix

      - name: Finalize & Reload PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/herbgarden
            
            # Restart the app (PM2 will read the newly copied ecosystem.config.cjs)
            pm2 reload herbgarden || pm2 start ecosystem.config.cjs