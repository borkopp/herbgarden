name: Global Build & Deploy (Standalone)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Build Standalone
        # This is where the 400% CPU happens (on GitHub, not your VPS!)
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'dummy-secret-for-build' }}
          DATABASE_URL: mongodb://127.0.0.1:27017/build-db
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL || 'http://localhost:3000' }}
        run: |
          pnpm install
          pnpm build

          # Copy public and static into standalone (Next.js doesn't do this automatically)
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp ecosystem.config.cjs .next/standalone/

          # Bundle everything into a single tar archive (preserves hidden folders like .next)
          cd .next/standalone
          tar -czf /tmp/herbgarden-deploy.tar.gz .

      - name: Upload archive to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "/tmp/herbgarden-deploy.tar.gz"
          target: "/tmp"
          strip_components: 2

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Wipe old deployment (preserve .env and logs)
            cd /root/herbgarden
            ls -A | grep -vE '^(.env|logs)$' | xargs rm -rf || true

            # Extract fresh build (tar handles hidden folders perfectly)
            tar -xzf /tmp/herbgarden-deploy.tar.gz -C /root/herbgarden
            rm /tmp/herbgarden-deploy.tar.gz

            # Verify critical files exist
            echo "--- Deployment contents ---"
            ls -la /root/herbgarden
            echo "--- .next contents ---"
            ls -la /root/herbgarden/.next

            # Restart with PM2
            pm2 startOrReload /root/herbgarden/ecosystem.config.cjs
            pm2 save